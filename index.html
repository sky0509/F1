<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>康宸 | Personal Website</title>
  <!-- 引入思源黑體提升美感 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <section class="hero">
    <div class="container hero-content">
      <!-- 新增：個人圖片區塊 -->
      <div class="hero-image-wrapper">
        <!-- src 替換成你的圖片路徑，例如 "images/profile.jpg" -->
        <img src="/685461869be47a0a7a17772ef7edac59_2901822734053913222.webp" alt="康宸的個人照" class="hero-img" />
      </div>
      <h1 class="hero-name">康宸 | Kang-Chen</h1>
      <p class="hero-tagline">
        台北大學法律系學生，持續打造有價值的作品
      </p>

      <div class="hero-buttons">
        <a href="#about" class="btn btn-primary">View Work</a>
        <a href="#contact" class="btn btn-secondary">Contact Me</a>
      </div>
    </div>
  </section>

  <section id="about" class="about">
    <div class="container">
      <h2 class="section-title">About Me</h2>
      <p class="about-text">
        我是一位持續學習與實作的學生，對技術與問題解決充滿興趣。
        目前專注於前端開發與程式設計基礎，透過不斷練習與專案累積經驗。
        喜歡將想法轉化為實際作品，並持續優化與成長。
      </p>
    </div>
  </section>

  <section id="contact" class="contact">
    <div class="container">
      <h2 class="section-title">Contact</h2>

      <div class="contact-list">
        <div class="contact-item">
          <span>Email</span>
          <a href="mailto:your@email.com">your@email.com</a>
        </div>

        <div class="contact-item">
          <span>GitHub</span>
          <a href="#" target="_blank">github.com/yourname</a>
        </div>

        <div class="contact-item">
          <span>LinkedIn</span>
          <a href="#" target="_blank">linkedin.com/in/yourname</a>
        </div>
      </div>
    </div>
  </section>

  <script src="/js/main.js"></script>
</body>
</html>
